<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gêneros</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">
    <!-- menu de navegacao superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">BookClub</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">Início</a>
                <a class="nav-link" href="usuarios.html">Usuários</a>
                <a class="nav-link" href="livros.html">Livros</a>
                <!-- ativo porque estamos nesta pagina -->
                <a class="nav-link active" href="generos.html">Gêneros</a>
                <a class="nav-link" href="clubes.html">Clubes</a>
                <a class="nav-link" href="resenhas.html">Resenhas</a>
            </div>
        </div>
    </nav>

    <div class="container" style="max-width: 650px;">
        <h2 class="mb-4 text-center">BookClub - Gêneros</h2>

        <!-- card com o formulario de cadastro -->
        <div class="card p-4 shadow-sm mb-4">

            <div class="mb-3">
                <label for="inputGenero" class="form-label fw-bold">Título do gênero</label>
                <input type="text" id="inputGenero" class="form-control" placeholder="Ex.: Romance" required>
            </div>

            <div class="mb-3">
                <label for="inputDescricao" class="form-label fw-bold">Descrição</label>
                <textarea id="inputDescricao" class="form-control" rows="3" placeholder="Descreva o gênero" required></textarea>
            </div>

            <!-- aqui aparece o botao de alterar quando o usuario clicar em editar -->
            <div id="alterar" class="mb-2"></div>

            <button class="btn btn-primary w-100" onclick="salvarGenero()">Cadastrar</button>
        </div>

        <h4 class="mb-3">Gêneros disponíveis</h4>

        <!-- o javascript coloca os cards dos generos aqui dentro (lado a lado, quebrando linha) -->
        <div id="card-genero" class="row g-3">
        </div>
    </div>

</body>
<script src="../js/generos.js"></script>
