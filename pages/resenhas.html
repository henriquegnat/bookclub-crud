<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resenhas</title>

    <!-- importando o css do bootstrap pela internet para deixar a pagina bonita e organizada -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* estilo para esconder o texto com spoiler */
        .spoiler {
            /* aplica um efeito de desfoque/borrão nas letras */
            filter: blur(6px);
            /* faz o efeito de desfoque sumir de forma suave */
            transition: filter 0.3s ease;
            /* coloca o cursor de maozinha para indicar que da para interagir */
            cursor: pointer;
            /* impede de selecionar o texto borrado sem querer */
            user-select: none;
        }

        /* quando passar o mouse por cima do spoiler */
        .spoiler:hover {
            /* zera o desfoque, revelando o texto para leitura */
            filter: blur(0);
            user-select: auto;
        }

        body{
            margin-bottom: 50px;
        }
    </style>
</head>

<body class="bg-light">
     <!-- menu de navegacao superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <!-- link para voltar ao inicio -->
            <a class="navbar-brand fw-bold" href="../index.html">BookClub</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">Início</a>
                <a class="nav-link" href="usuarios.html">Usuários</a>
                <a class="nav-link" href="livros.html">Livros</a>
                <a class="nav-link" href="generos.html">Gêneros</a>
                <a class="nav-link" href="clubes.html">Clubes</a>
                <!-- esse fica marcado como ativo porque estamos nele -->
                <a class="nav-link active" href="resenhas.html">Resenhas</a>
            </div>
        </div>
    </nav>

    <!-- container principal que centraliza todo o conteudo na tela com largura maxima -->
    <div class="container" style="max-width: 650px;">
        <!-- titulo da pagina -->
        <h2 class="mb-4 text-center">Resenhas</h2>

        <!-- caixinha branca (card) com sombra que guarda o formulario -->
        <div class="card p-4 shadow-sm mb-4">
            
            <!-- campo para selecionar o usuario -->
            <div class="mb-3">
                <label for="inputUsuario" class="form-label fw-bold">Nome do usuário</label>
                <select id="inputUsuario" class="form-select" required>
                    <!-- opcao padrao que fica desativada depois de aberta para forcar a escolha -->
                    <option value="" disabled selected>Selecione um usuário</option>
                </select>
            </div>

            <!-- campo para selecionar o livro -->
            <div class="mb-3">
                <label for="inputLivro" class="form-label fw-bold">Livro</label>
                <select id="inputLivro" class="form-select" required>
                    <option value="" disabled selected>Selecione um livro</option>
                </select>
            </div>

            <!-- campo de texto grande para escrever a resenha -->
            <div class="mb-3">
                <label for="inputResenha" class="form-label fw-bold">Resenha</label>
                <textarea id="inputResenha" class="form-control" rows="3" placeholder="Digite sua resenha" required></textarea>
            </div>

            <!-- campo de selecao para a nota do livro de 1 a 5 -->
            <div class="mb-3">
                <label for="inputNota" class="form-label fw-bold">Nota</label>
                <select id="inputNota" class="form-select" required>
                    <option value="">Selecione uma nota</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>

            <!-- caixinha de marcar se a resenha contem spoiler -->
            <div class="form-check mb-3">
                <input type="checkbox" id="inputSpoiler" class="form-check-input">
                <label for="inputSpoiler" class="form-check-label fw-bold">Spoiler</label>
            </div>

            <!-- espaco vazio onde o botao de alterar vai aparecer quando o usuario clicar em editar -->
            <div id="alterar" class="mb-2"></div>

            <!-- botao para cancelar a edicao -->
            <div id="cancelar" class="mb-2"></div>


            <!-- botao principal para enviar e salvar uma nova resenha -->
            <button id="btnEnviar" class="btn btn-primary w-100" onclick="salvarResenha()">Enviar</button>
        </div>

        <!-- titulo da secao de resenhas postadas -->
        <h4 class="mb-3">Resenhas publicadas</h4>

        <!-- essa div comeca vazia; o javascript vai colocar os cards das resenhas aqui dentro -->
        <div id="card-resenha" class="d-flex flex-column gap-3">
        </div>
    </div>

</body>
<!-- importando o arquivo de javascript responsavel pela logica do sistema -->
<script src="../js/resenhas.js"></script>

</html>
