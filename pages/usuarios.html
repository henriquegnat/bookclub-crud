<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookClub - Leitores</title>

    <!-- Bootstrap usado para a aparência da página -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <!-- menu de navegacao superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <!-- link para voltar ao inicio -->
            <a class="navbar-brand fw-bold" href="../index.html">BookClub</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">Início</a>
                <a class="nav-link active" href="usuarios.html">Usuários</a>
                <a class="nav-link" href="livros.html">Livros</a>
                <a class="nav-link" href="generos.html">Gêneros</a>
                <a class="nav-link" href="clubes.html">Clubes</a>
                <!-- esse fica marcado como ativo porque estamos nele -->
                <a class="nav-link" href="resenhas.html">Resenhas</a>
            </div>
        </div>
    </nav>

    <!-- container centralizado para controlar a dimensao da pagina -->
    <div class="container pb-5" style="max-width: 850px;">

        <h1 class="mb-4 text-center">BookClub - Leitores</h1>

        <!-- FORMULÁRIO DE CADASTRO E EDIÇÃO DO LEITOR -->
        <div class="card p-4 shadow-sm mb-4">

            <h2 class="h4 mb-3">Cadastro de Leitor</h2>

            <!-- Campo nome -->
            <label for="nome" class="form-label fw-bold">Nome</label>
            <input type="text" id="nome" class="form-control mb-3" required>

            <!-- Campo e-mail -->
            <label for="email" class="form-label fw-bold">E-mail</label>
            <input type="email" id="email" class="form-control mb-3" required>

            <!-- Campo meta de leitura -->
            <label for="meta_leitura" class="form-label fw-bold">Meta anual de leitura</label>
            <input type="number" id="meta_leitura" class="form-control mb-3" required>

            <!-- Este botão inicia o CREATE no usuarios.js -->
            <button id="btn_adicionar" class="btn btn-primary w-100">Adicionar</button>

            <!-- O JavaScript coloca aqui o botão Alterar -->
            <div id="alterar" class="mt-3"></div>

        </div>

        <!-- READ: local onde os leitores cadastrados são mostrados -->
        <div class="card p-4 shadow-sm">

            <h2 class="h4 mb-3">Leitores Cadastrados</h2>

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">

                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">E-mail</th>
                            <th scope="col">Meta de leitura</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>

                    <!-- O JavaScript coloca os usuários dentro deste tbody -->
                    <tbody id="lista_usuarios"></tbody>

                </table>
            </div>

        </div>

    </div>

    <!-- JavaScript da página de usuários -->
    <script src="../js/usuarios.js"></script>

</body>
</html>
