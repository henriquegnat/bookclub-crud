<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookClub - Leitores</title>

    <!-- Bootstrap usado para a aparência da página -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container bg-body-tertiary py-5">

    <h1 class="mb-4">BookClub - Leitores</h1>

    <!-- FORMULÁRIO DE CADASTRO E EDIÇÃO DO LEITOR -->
    <div class="card p-4 mb-4">

        <h2 class="h4 mb-3">Cadastro de Leitor</h2>

        <!-- Campo nome -->
        <label for="nome" class="form-label">Nome</label>
        <input type="text" id="nome" class="form-control mb-3" required>

        <!-- Campo e-mail -->
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" class="form-control mb-3" required>

        <!-- Campo meta de leitura -->
        <label for="meta_leitura" class="form-label">Meta anual de leitura</label>
        <input type="number" id="meta_leitura" class="form-control mb-3" required>

        <!-- Este botão inicia o CREATE no usuarios.js -->
        <button id="btn_adicionar" class="btn btn-primary">Adicionar</button>

        <!-- O JavaScript coloca aqui o botão Alterar -->
        <div id="alterar" class="mt-3"></div>

    </div>

    <!-- READ: local onde os leitores cadastrados são mostrados -->
    <div class="card p-4">

        <h2 class="h4 mb-3">Leitores Cadastrados</h2>

        <div class="table-responsive">
            <table class="table table-striped">

                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Nome</th>
                        <th scope="col">E-mail</th>
                        <th scope="col">Meta de leitura</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>

                <!-- O JavaScript coloca os usuários dentro deste tbody -->
                <tbody id="lista_usuarios"></tbody>

            </table>
        </div>

    </div>

    <!-- JavaScript da página de usuários -->
    <script src="../js/usuarios.js"></script>

</body>
</html>
